<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة الطالب | المعهد العالي للسياحة والفنادق</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
    :root { --main:#0b3c5d; --accent:#1d72b8; --bg:#eef2f7; --success:#1a9e5a; --error:#dc3545; --white:#fff; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Cairo','Segoe UI',Tahoma,sans-serif; background:var(--bg); display:flex; flex-direction:column; min-height:100vh; }
    .header { background:linear-gradient(135deg,var(--main) 0%,#1a5a8a 100%); color:var(--white); padding:12px 20px; display:flex; align-items:center; gap:15px; box-shadow:0 4px 15px rgba(0,0,0,.25); }
    .header img { height:55px; border-radius:8px; background:#fff; padding:3px; }
    .header .title { font-size:1.1rem; font-weight:900; }
    .header .subtitle { font-size:.82rem; opacity:.85; margin-top:2px; }
    
    .main-content { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:20px 15px; gap:15px; }
    
    .login-card { background:var(--white); width:100%; max-width:400px; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.12); overflow:hidden; animation:fadeInUp .4s ease; }
    @keyframes fadeInUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    
    .card-header { background:linear-gradient(135deg,var(--main),var(--accent)); padding:15px 15px; text-align:center; color:#fff; }
    .card-header .icon { font-size:2rem; margin-bottom:4px; }
    .card-header h2 { font-size:1.05rem; font-weight:900; }
    .card-header p { font-size:.8rem; opacity:.9; margin-top:3px; }
    
    .card-body { padding:18px 20px; }
    .form-group { margin-bottom:14px; }
    label { display:block; margin-bottom:6px; font-weight:700; color:#333; font-size:.85rem; }
    label .hint { font-weight:400; color:#888; font-size:.78rem; margin-right:4px; }
    input[type="text"] { width:100%; padding:10px 12px; border:2px solid #e0e0e0; border-radius:8px; font-size:1.05rem; font-family:'Cairo',sans-serif; transition:all .3s; text-align:center; letter-spacing:2px; color:var(--main); font-weight:700; }
    input:focus { border-color:var(--accent); outline:none; box-shadow:0 0 0 3px rgba(29,114,184,.15); }
    
    .btn-main { width:100%; padding:12px; background:linear-gradient(135deg,var(--main),var(--accent)); color:#fff; border:none; border-radius:8px; font-size:.95rem; font-weight:900; font-family:'Cairo',sans-serif; cursor:pointer; transition:all .3s; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:5px; }
    .btn-main:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 5px 15px rgba(11,60,93,.3); }
    .btn-main:disabled { opacity:.65; cursor:not-allowed; transform:none; }
    
    #msg { margin-top:12px; padding:10px 12px; border-radius:8px; text-align:center; font-size:.85rem; font-weight:600; display:none; line-height:1.4; white-space:pre-line; }
    #msg.error { background:#fde8ea; color:#b71c1c; border:1px solid #f5c2c7; }
    #msg.success { background:#e8f5e9; color:#1b5e20; border:1px solid #c3e6cb; }
    #msg.info { background:#e3f2fd; color:#0d47a1; border:1px solid #b6d4fe; }
    #msg.warning { background:#fff3e0; color:#e65100; border:1px solid #ffcc80; }
    #msg.locked { background:#fce4ec; color:#880e4f; border:2px solid #f48fb1; font-weight:900; }
    
    .card-footer img { width:100%; display:block; }
    
    .info-panel { max-width:400px; width:100%; }
    .info-badge { background:#fff; border-radius:10px; padding:10px; text-align:center; box-shadow:0 3px 10px rgba(0,0,0,.05); border-top:3px solid var(--accent); font-size:.8rem; color:#555; }
    .info-badge strong { display:inline-block; color:var(--main); margin-left:5px; font-size:.85rem; }
    
    .spinner { display:inline-block; width:15px; height:15px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
    <img src="logo.jpg" alt="Logo">
    <div>
        <div class="title">المعهد العالي للسياحة والفنادق بالغردقة</div>
        <div class="subtitle">بوابة الطلاب الإلكترونية — نتائج الفصل الصيفي summer course</div>
    </div>
</div>

<div class="main-content">
    <div class="login-card">
        <div class="card-header">
            <div class="icon">🎓</div>
            <h2>تسجيل الدخول</h2>
            <p>أدخل رقمك القومي بشكل صحيح لعرض نتيجة الفصل الصيفي</p>
        </div>

        <div class="card-body">
            <div id="step1Section">
                <div class="form-group">
                    <label>الرقم القومي <span class="hint">(14 رقم)</span></label>
                    <input type="text" id="nationalIdInput" placeholder="أدخل الرقم القومي" maxlength="14" inputmode="numeric" autocomplete="off">
                </div>
                <button class="btn-main" id="step1Btn" type="button">
                    <span>عرض النتيجة</span><span>←</span>
                </button>
            </div>

            <div id="msg"></div>
        </div>

        <div class="card-footer"><img src="Cong.jpg" alt="بانر المعهد"></div>
    </div>

    <div class="info-panel">
        <div class="info-badge">☀️ <strong>الفصل الصيفي:</strong> استعلام نتائج المقررات</div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyVRj4cc24Xe7HYFtBBHoodi9tyXGnhDZr4WnraLhU3UX7wcmu92xlQg22DDFvq0VBCqQ/exec";
    const TIMEOUT_MS = 20000;

    const BTN1_HTML = '<span>عرض النتيجة</span><span>←</span>';

    function cleanDigits(v) {
        return v.replace(/[\u0660-\u0669]/g, d => d.charCodeAt(0) - 0x0660)
                .replace(/[\u06F0-\u06F9]/g, d => d.charCodeAt(0) - 0x06F0)
                .replace(/[^0-9]/g, '');
    }

    function isValidNationalId(id) {
        if (!/^[23]\d{13}$/.test(id)) return false;
        const month = parseInt(id.substr(3, 2), 10);
        const day = parseInt(id.substr(5, 2), 10);
        return month >= 1 && month <= 12 && day >= 1 && day <= 31;
    }

    async function callApi(payload) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
        try {
            const res = await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify(payload),
                signal: ctrl.signal,
                headers: { "Content-Type": "text/plain" }
            });
            if (!res.ok) throw new Error("HTTP " + res.status);
            return await res.json();
        } catch (err) {
            if (err.name === "AbortError") throw new Error("timeout");
            throw err;
        } finally {
            clearTimeout(timer);
        }
    }

    function isBlocked() {
        const blockUntil = Number(localStorage.getItem("blockUntil") || 0);
        return blockUntil && Date.now() < blockUntil ? Math.ceil((blockUntil - Date.now()) / 1000) : 0;
    }

    async function doStep1() {
        const input = cleanDigits(document.getElementById('nationalIdInput').value.trim());

        const wait = isBlocked();
        if (wait) { showMsg("⛔ محظور مؤقتاً. حاول بعد " + wait + " ثانية", "error"); return; }

        if (!isValidNationalId(input)) {
            showMsg("يرجى إدخال رقم قومي صحيح مكون من 14 رقماً", "error");
            return;
        }

        const btn = document.getElementById('step1Btn');
        setLoading(btn, true, "جاري التحقق...");
        showMsg("يتم البحث في قاعدة البيانات...", "info");

        try {
            const data = await callApi({ action: "getStudentCode", nationalId: input });

            if (data.status === "success") {
                showMsg("⏳ انتظر جاري إظهار النتيجة المطلوبة...", "info");
                await autoLogin(data.code, input, btn);
                return;
            }
            if (data.status === "inactive") {
                showMsg("⛔ لا يمكن عرض النتيجة\nيرجى التوجه إلى الإدارة المالية", "locked");
            } else if (data.status === "not_found") {
                handleFailedAttempt();
                showMsg("❌ يرجى التأكد من رقمك القومي\nأو التوجه إلى شئون الطلاب لحل المشكلة", "warning");
            } else {
                handleFailedAttempt();
                showMsg(data.msg || "خطأ غير متوقع، حاول مرة أخرى", "error");
            }
        } catch (e) {
            if (e.message === "timeout") {
                showMsg("⏱️ انتهت مدة الانتظار، يرجى التحقق من الإنترنت والمحاولة مرة أخرى", "error");
            } else {
                showMsg("خطأ في الاتصال بالسيرفر، حاول مرة أخرى", "error");
            }
        }
        setLoading(btn, false, BTN1_HTML);
    }

    async function autoLogin(studentCode, nationalId, btn) {
        try {
            const loginData = await callApi({
                action: "login",
                code: studentCode,
                password: nationalId,
                ua: navigator.userAgent
            });

            if (loginData.status === "success") {
                localStorage.removeItem("loginAttempts");
                localStorage.removeItem("blockUntil");
                localStorage.setItem("studentData", JSON.stringify({ ...loginData.user, nationalId: nationalId }));
                
                showMsg("✅ تم التعرف بنجاح! جاري تحويلك للنتيجة...", "success");
                
                // تعديل اسم الملف هنا إلى summer_results.html
                setTimeout(function () { window.location.href = "summer_results.html"; }, 800);
                return;
            }
            if (loginData.status === "locked") {
                showMsg("⛔ " + (loginData.msg || "الحساب موقوف"), "error");
            } else {
                handleFailedAttempt();
                showMsg("❌ " + (loginData.msg || "خطأ في البيانات"), "error");
            }
        } catch (e) {
            showMsg("خطأ في الاتصال بالسيرفر أثناء التحويل للنتيجة", "error");
        }
        setLoading(btn, false, BTN1_HTML);
    }

    function handleFailedAttempt() {
        let attempts = parseInt(localStorage.getItem("loginAttempts") || "0", 10) + 1;
        localStorage.setItem("loginAttempts", attempts);
        if (attempts >= 4) {
            localStorage.setItem("blockUntil", Date.now() + 5 * 60 * 1000);
            localStorage.setItem("loginAttempts", "0");
            showMsg("⛔ تجاوزت المحاولات المسموحة. محظور لمدة 5 دقائق.", "error");
        }
    }

    function setLoading(btn, loading, html) {
        btn.disabled = loading;
        btn.innerHTML = loading ? '<span class="spinner"></span> <span>' + html + '</span>' : html;
    }

    function showMsg(text, type) {
        const msg = document.getElementById('msg');
        msg.innerText = text;
        msg.className = type;
        msg.style.display = "block";
    }

    document.getElementById('nationalIdInput').addEventListener('input', function () {
        this.value = cleanDigits(this.value).slice(0, 14);
    });
    document.getElementById('nationalIdInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') doStep1();
    });
    document.getElementById('step1Btn').addEventListener('click', doStep1);

    window.onload = function () {
        const wait = isBlocked();
        if (wait) showMsg("⛔ محظور مؤقتاً. حاول بعد " + wait + " ثانية.", "error");
    };
</script>
</body>
</html>
